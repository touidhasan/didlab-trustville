[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "paris"   # conservative target for the DIDLab Besu chain
optimizer = true
optimizer_runs = 200
# Deployment scripts write addresses; the module 16 proof test reads its fixture. Nothing
# else is readable -- fs access in tests is off by default for good reason.
fs_permissions = [
  { access = "read-write", path = "../deployments" },
  { access = "read", path = "./test/fixtures" },
]

remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

# Tests run without the optimizer. Compiling the whole project WITH it has crashed solc on
# the build box (std::bad_alloc, SIGSEGV, "stack smashing detected") as the project grew
# past ~100 files, and tests do not need optimized bytecode -- they need to run.
#
#   FOUNDRY_PROFILE=test forge test        # unoptimized, fast, safe here
#   forge build --skip test                # optimized, what actually gets deployed
#
# Profiles inherit from [profile.default], so everything else stays the same. Deployments
# still use the default profile, so the bytecode on chain is optimized as before.
[profile.test]
optimizer = false

[rpc_endpoints]
didlab = "https://eth.didlab.org"

[fmt]
line_length = 100
# Generated files. Formatting them would be undone the next time they are regenerated, and
# CI's `forge fmt --check` would fail on a file nobody wrote.
ignore = ["src/PoseidonT3.sol", "src/Groth16Verifier.sol"]
